name: Build

# Builds, tests and packages every release target. The release workflow calls
# this workflow and publishes the packages it produces. All the build logic is
# in ci/build.py; the jobs here only provide the toolchains.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  workflow_call:

jobs:
  linux:
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    # Build inside the distribution's own image, so that each package links
    # against that distribution's glibc and libstdc++.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ubuntu-22.04_x86_64, runner: ubuntu-24.04, image: 'ubuntu:22.04' }
          - { package: ubuntu-24.04_x86_64, runner: ubuntu-24.04, image: 'ubuntu:24.04' }
          - { package: ubuntu-26.04_x86_64, runner: ubuntu-24.04, image: 'ubuntu:26.04' }
          - { package: ubuntu-22.04_armv8, runner: ubuntu-24.04-arm, image: 'ubuntu:22.04', options: '-D neon=enabled' }
          - { package: ubuntu-24.04_armv8, runner: ubuntu-24.04-arm, image: 'ubuntu:24.04', options: '-D neon=enabled' }
          - { package: ubuntu-26.04_armv8, runner: ubuntu-24.04-arm, image: 'ubuntu:26.04', options: '-D neon=enabled' }
          # Raspberry Pi OS (64-bit) is based on Debian bookworm
          - { package: raspberry-pi-os_armv8, runner: ubuntu-24.04-arm, image: 'debian:bookworm', options: '-D neon=enabled' }
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates g++ ninja-build pkg-config python3 python3-venv
          # The distribution's meson is too old on some of the images
          python3 -m venv /opt/meson
          /opt/meson/bin/pip install meson
          echo /opt/meson/bin >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: python3 ci/build.py native --package ${{ matrix.package }} --tests ${{ matrix.options }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.package }}
          path: dist/*
          retention-days: 30

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.package }}
          path: ci-work/build/meson-logs/
          retention-days: 5

  macos:
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: macos_x86_64, runner: macos-15-intel }
          - { package: macos_arm64, runner: macos-15, options: '-D neon=enabled' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install meson ninja

      - name: Build and test
        run: python3 ci/build.py native --package ${{ matrix.package }} --tests ${{ matrix.options }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.package }}
          path: dist/*
          retention-days: 30

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.package }}
          path: ci-work/build/meson-logs/
          retention-days: 5

  windows:
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: windows_x86_64, runner: windows-latest, arch: x64, msvc-arch: amd64 }
          # Upstream only builds its NEON code with clang-cl on Windows; with
          # MSVC the AEC3 NEON filter adaptation is not bit exact with the
          # generic code, so use the latter.
          - { package: windows_arm64, runner: windows-11-arm, arch: arm64, msvc-arch: arm64, options: '-D neon=disabled' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: pip install meson ninja

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Build and test
        run: python ci/build.py native --package ${{ matrix.package }} --tests ${{ matrix.options }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.package }}
          path: dist/*
          retention-days: 30

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.package }}
          path: ci-work/build/meson-logs/
          retention-days: 5

  android:
    name: android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install meson

      # Uses the NDK preinstalled on the runner ($ANDROID_NDK_LATEST_HOME)
      - name: Build
        run: python ci/build.py android

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: dist/*
          retention-days: 30

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android
          path: ci-work/android-build-*/meson-logs/
          retention-days: 5

  ios:
    name: ios
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install meson ninja

      - name: Build
        run: python3 ci/build.py ios

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-ios
          path: dist/*
          retention-days: 30

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ios
          path: ci-work/ios-build-*/meson-logs/
          retention-days: 5
