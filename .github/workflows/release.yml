name: Release

on:
  push:
    tags:
      # m<milestone>.<branch>.<branch position>.<build>, e.g. m153.8010.0.0
      - 'm[0-9]*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., m153.8010.0.0)'
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          # m<milestone>.<branch>.<branch position>.<build>
          IFS=. read -r MILESTONE BRANCH _ <<< "$TAG"
          echo "milestone=${MILESTONE#m}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ## WebRTC Audio Processing ${{ steps.tag.outputs.tag }}

            Based on the WebRTC M${{ steps.tag.outputs.milestone }} release (branch-heads/${{ steps.tag.outputs.branch }}). See [NEWS](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.tag }}/NEWS) for details.

            ### Packages

            | Package | Contents |
            |---|---|
            | `webrtc-audio-processing.ubuntu-{22.04,24.04,26.04}_x86_64.tar.gz` | Shared library, headers and pkg-config file, built on the given Ubuntu release |
            | `webrtc-audio-processing.ubuntu-{22.04,24.04,26.04}_armv8.tar.gz` | Same, for 64-bit ARM |
            | `webrtc-audio-processing.raspberry-pi-os_armv8.tar.gz` | Same, for 64-bit Raspberry Pi OS (Debian bookworm) |
            | `webrtc-audio-processing.macos_{x86_64,arm64}.tar.gz` | Shared library, headers and pkg-config file (macOS 12+) |
            | `webrtc-audio-processing.windows_{x86_64,arm64}.zip` | DLL, import library and headers (MSVC) |
            | `webrtc-audio-processing.android.tar.gz` | Shared libraries for `arm64-v8a`, `armeabi-v7a` and `x86_64` (API 24+), and headers |
            | `WebRTCAudioProcessing.xcframework.zip` | Static library for iOS devices and the simulator (iOS 14+), and headers |

            Headers are in `include/webrtc-audio-processing-3`, and abseil-cpp is linked in statically. When not using pkg-config, define `WEBRTC_POSIX` (or `WEBRTC_WIN` on Windows) when building against the headers. Each package contains the licenses of the code it includes.
          files: dist/*
          draft: false
          prerelease: false
